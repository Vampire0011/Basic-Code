<html>
<body><style>body{
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}canvas{
    background:#f5f5f5;
    border:3px solid #000;
}</style>
<canvas id="cv" width="700" height="500"></canvas>
<script>
const c = document.getElementById("cv");
const x = c.getContext("2d");
x.fillStyle="#e3f2fd";
x.fillRect(0,0,c.width,c.height);
x.beginPath();
x.arc(120,120,50,0,2*Math.PI);
x.fillStyle="#ff7043";
x.fill();
x.stroke();
x.fillStyle="#66bb6a";
x.fillRect(220,80,150,100);
x.strokeRect(220,80,150,100);
x.beginPath();
x.moveTo(420,80);
x.lineTo(600,180);
x.lineWidth=3;
x.stroke();
x.beginPath();
x.moveTo(120,300);
x.lineTo(60,400);
x.lineTo(180,400);
x.closePath();
x.fillStyle="#ab47bc";
x.fill();
x.stroke();
x.fillStyle="#000";
x.font="30px Arial";
x.fillText("One Piece",260,460);
</script></body>
</html>
