<!DOCTYPE html>
<html>
<head>
<style>
div p {
  color: blue;
}

div > h3 {
  color: green;
}

h1 + p {
  color: red;
}

h2 ~ p {
  color: purple;
}
</style>
</head>
<body>

<h1>Mickey Mouse</h1>
<p>Donald Duck</p>

<div>
  <p>Capybara</p>
  <h3>Child OF Capybara</h3>
</div>

<h2>Ben 10</h2>
<p>Alien x</p>
<p>Forearms</p>

</body>
</html>
