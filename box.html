<!DOCTYPE html>
<html>
<head>
<title>8 Boxes Example</title>

<style>
.box{
    width:150px;
    height:80px;
    margin:15px;
    padding:20px;
    display:inline-block;
}

.solid{
    border:4px solid black;
}

.dashed{
    border:4px dashed blue;
}

.dotted{
    border:4px dotted red;
}

.double{
    border:6px double green;
}
.groove{
    border:6px groove purple;
}
.ridge{
    border:6px ridge orange;
}
.inset{
    border:6px inset cyan;
}
.outset{
    border:6px outset magenta;
}
</style>

</head>

<body>

<div class="box solid">CAPYBARA</div>

<div class="box dashed">CAPYBARA</div>

<div class="box dotted">CAPYBARA</div>

<div class="box double">CAPYBARA</div>

<div class="box groove">CAPYBARA</div> 

<div class="box ridge">CAPYBARA</div>

<div class="box inset">CAPYBARA</div>

<div class="box outset">CAPYBARA</div>

</body>
</html>
