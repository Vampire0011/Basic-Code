<html>
<body>
<h3> Customer Registration Form <h3>
<form action="xyz.html">
<label> Customer Name </label>
<input type="text" name="name"> <br>
<label> Password </label>
<input type="password" name="pos"> <br>
<label> Email </label>
<input type="email" name = "mail"> <br>
<label> Phone number </label>
<input type="number" name="number"> <br>
<label> Customer ID </label>
<input type="text" name="10"> <br>
<label> Date of Birth </label>
<input type="date" name="dob"> <br>
<label> Preferred contact time </label>
<input type = "time" name="time"><br>
<label> Address </label>
<textarea name = "add" rows = "5" cols="20">
</textarea> <br>
<label> Gender </label>
<input type="radio" name="g" value="m"> Male
<input type="radio" name = "g" value="f"> Female
<input type = "radio" name = "g" value="0"> other
<br>
Service Intrested 
<input type="checkbox" name="int">Internet
<input type="checkbox" name="mob">Mobile
<input type="checkbox" name="dth">DTH
<br>
Account Type 
<select name="acc">
<option value="x">Savings</option>
<option value="y">Current</option>
<option value="o">Other</option>
</select><br>
Favourite Color <input type="color" name="col"><br>
Satisfaction Level <input type="range" name="Sl" min="0" max="10"><br>
Upload Photo <input type="file" name="file"><br>
Website <input type="url" name="url"><br>
Search Product <input type="text" name="sp"><br>
<button type="submit">Register</button>
<button type="reset">Clear</button>
</form>
</body>
</html>
