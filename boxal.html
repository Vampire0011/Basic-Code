<!DOCTYPE html>
<html>
<head>
<title>8 Boxes Example</title>

<style>
.boxx{
    width:150px;
    height:80px;
    margin:15px;
    padding:20px;
    display:inline-block;
    border:4px  rgb(13, 254, 182);
}
.boxy{
    width:150px;
    height:80px;
    margin:15px;
    padding:20px;
    display:inline-block;
    border:4px  rgb(254, 13, 186);

}
.x {
    border-top-style: solid;
    border-bottom-style: dashed;
    border-left-style: double;
    border-right-style: dotted;
    
}

.y {
    border-top-style: ridge;
    border-bottom-style: groove;
    border-left-style: inset;
    border-right-style: outset;
    
}
</style>
</head>
<body>
    <div class="boxx x">CAPYBARA</div>

<div class="boxy y">CAPYBARA</div>


</body></html>
