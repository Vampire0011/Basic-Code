<!DOCTYPE html>
<html>
<head>
<title>Display Property Example</title>
<style>

.imgbox{
position:relative;
display:inline-block;
}

.imgbox img{
opacity:0.8;
width:800px;
}

.imgtext{
position:absolute;
top:230px;
left:10px;
color:rgb(1, 255, 179);
font-size:20px;
font-family:papyrus;
}

.block{
display:block;
background-color:lightblue;
width:200px;
margin:10px;
padding:10px;
border:2px solid black;
}

.inline{
display:inline;
background-color:lightgreen;
padding:10px;
border:2px solid black;
}

.inlineblock{
display:inline-block;
background-color:lightcoral;
width:150px;
margin:10px;
padding:10px;
border:2px solid black;
}

</style>
</head>

<body>

<div class="imgbox">
<img src="luffy.jpg" type="image/jpeg" alt="Luffy Image">
<div class="imgtext">MONKEY D.LUFFY</div>
</div>

<h2>1</h2>
<div class="block">CAPYBARA</div>
<div class="block">CAPYBARA</div>

<h2>2</h2>
<span class="inline">CAPYBARA</span>
<span class="inline">CAPYBARA</span>
<span class="inline">CAPYBARA</span>

<h2>3</h2>
<div class="inlineblock">CAPYBARA</div>
<div class="inlineblock">CAPYBARA</div>
<div class="inlineblock">CAPYBARA</div>

</body>
</html>
